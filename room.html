<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Scan Room</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="room-page">
    <main class="room-layout">
      <a class="room-back" href="./" aria-label="Return to the archive">←</a>

      <section class="scene-wrap" aria-label="Interactive 3D scan">
        <canvas id="scan-canvas"></canvas>
        <label class="scan-upload" for="ply-upload">
          <span>PLY</span>
          <input id="ply-upload" type="file" accept=".ply" />
        </label>
      </section>
    </main>
    <script type="module" src="room.js"></script>
  </body>
</html>
